x-env: &shared_env
    APP_PORT: ${APP_PORT:-8080} # The port the cpp server listens on
    APP_PATH: ${APP_PATH:-/app_path} # The path in which files will be saved
    WEB_PORT: ${WEB_PORT:-3000} # The port the web server listens on

services:
  server:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/servers/dockerfile
    volumes:
      - appfiles:${APP_PATH:-/app_path}
    networks:
      - app_net

  cpp-client:
    # Defines a interactive shell
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/clients/dockerfile-cpp
    networks:
      - app_net

  py-client:
    # Defines a interactive shell
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/clients/dockerfile-py
    networks:
      - app_net

  web-server:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/MVC/dockerfile
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    networks:
      - app_net

  gtests:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: tests/dockerfile

volumes:
  appfiles:

networks:
  app_net: