services:
  app:
    # The path in which files will be saved
    environment:
      - APP_PATH="mypath"
    # Defines a interactive shell
    stdin_open: true
    tty: true
    build:
      context: ./src
      dockerfile: dockerfile

  gtests:
    environment:
      - APP_PATH="mypath"
    build:
      context: .
      dockerfile: dockerfile