x-env: &shared_env
  APP_PORT: ${APP_PORT:-8080} # The port the cpp server listens on
  APP_PATH: ${APP_PATH:-/app_path} # The path in which files will be saved
  MAX_CLIENTS: ${MAX_CLIENTS:-2}
  MAX_CLIENTS_AT_ONCE: ${MAX_CLIENTS_AT_ONCE:-3}
  WEB_PORT: ${WEB_PORT:-3000} # The port the web server listens on
  JWT_SECRET: ${JWT_SECRET:-0c65905c90fc5bf2fa1bcef939b851c7} # Secret key for JWT authentication
  REACT_PORT: ${REACT_PORT:-5173} # The port the react app runs on
  HOST_IP: ${HOST_IP:-'localhost'} # Host computer IP
  MONGO_URI: mongodb://mongodb:27017/google_drive_db # Updated to use the service name 'mongodb' for internal container networking
  STORAGE_HOST: storage-server # Added to tell the Node.js server where the C++ storage server is

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app_net

  storage-server:
    container_name: storage-server
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/servers/dockerfile
    volumes:
      - appfiles:${APP_PATH:-/app_path}
    networks:
      - app_net

  cpp-client:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/clients/dockerfile-cpp
    stdin_open: true
    tty: true
    networks:
      - app_net

  py-client:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/clients/dockerfile-py
    stdin_open: true
    tty: true
    networks:
      - app_net

  web-server:
    container_name: web-server
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/web-server/dockerfile
    depends_on:
      - mongodb
      - storage-server
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    networks:
      - app_net

  react-app:
    environment:
      - VITE_WEB_PORT=${WEB_PORT:-3000}
      - REACT_PORT=${REACT_PORT:-5173}
    build:
      context: .
      dockerfile: src/react-app/dockerfile
    ports:
      - "${REACT_PORT:-5173}:${REACT_PORT:-5173}"
    networks:
      - app_net

  mobile-app:
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-'localhost'}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: src/mobile-app/dockerfile
    networks:
      - app_net

  gtests:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: tests/dockerfile

volumes:
  appfiles:
  mongo-data:

networks:
  app_net:
    driver: bridge