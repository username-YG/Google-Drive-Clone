x-env: &shared_env
    APP_PORT: ${APP_PORT:-8080}
    APP_PATH: ${APP_PATH:-/app_path}
    MAX_CLIENTS: ${MAX_CLIENTS:-2}
    MAX_CLIENTS_AT_ONCE: ${MAX_CLIENTS_AT_ONCE:-3}

services:
  server:
    # The path in which files will be saved
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/servers/dockerfile
    volumes:
      - appfiles:${APP_PATH:-/app_path}
    networks:
      - app_net

  cpp-client:
    # Defines a interactive shell
    platform: linux/amd64
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/clients/dockerfile-cpp
    networks:
      - app_net

  py-client:
    # Defines a interactive shell
    platform: linux/amd64
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/clients/dockerfile-py
    networks:
      - app_net

  gtests:
    platform: linux/amd64
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: tests/dockerfile

volumes:
  appfiles:

networks:
  app_net: