services:
  server:
    # The path in which files will be saved
    environment:
      - APP_PATH=/mypath
    build:
      context: .
      dockerfile: src/servers/dockerfile
    volumes:
      - appfiles:/mypath
    networks:
      - app_net

  client:
    # Defines a interactive shell
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: src/clients/dockerfile
    networks:
      - app_net

  gtests:
    environment:
      - APP_PATH=/mypath
    build:
      context: .
      dockerfile: tests/dockerfile

volumes:
  appfiles:

networks:
  app_net: