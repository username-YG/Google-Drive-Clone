x-env: &shared_env
    APP_PORT: ${APP_PORT:-8080} # The port the cpp server listens on
    APP_PATH: ${APP_PATH:-/app_path} # The path in which files will be saved
    MAX_CLIENTS: ${MAX_CLIENTS:-2}
    MAX_CLIENTS_AT_ONCE: ${MAX_CLIENTS_AT_ONCE:-3}
    WEB_PORT: ${WEB_PORT:-3000} # The port the web server listens on
    JWT_SECRET: ${JWT_SECRET:-0c65905c90fc5bf2fa1bcef939b851c7} # Secret key for JWT authentication
    REACT_PORT: ${REACT_PORT:-5173} # The port the react app runs on

services:
  storage-server:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/servers/dockerfile
    volumes:
      - appfiles:${APP_PATH:-/app_path}
    networks:
      - app_net

  cpp-client:
    # Defines a interactive shell
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/clients/dockerfile-cpp
    networks:
      - app_net

  py-client:
    # Defines a interactive shell
    stdin_open: true
    tty: true
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/storage-server/clients/dockerfile-py
    networks:
      - app_net

  web-server:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: src/web-server/dockerfile
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    networks:
      - app_net

  react-app:
    environment:
      - VITE_WEB_PORT=${WEB_PORT:-3000}
      - REACT_PORT=${REACT_PORT:-5173}
    build:
      context: .
      dockerfile: src/react-app/dockerfile
    ports:
      - "${REACT_PORT:-5173}:${REACT_PORT:-5173}"
    networks:
      - app_net

  mobile-app:
    environment:
    - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: src/mobile-app/dockerfile
    networks:
      - app_net

  gtests:
    environment:
      <<: *shared_env
    build:
      context: .
      dockerfile: tests/dockerfile

volumes:
  appfiles:

networks:
  app_net: